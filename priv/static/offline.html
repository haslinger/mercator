<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #fbf6ec; color: #2a1d12; text-align: center; padding: 1rem; }
      button { margin-top: 1rem; padding: 0.6rem 1.2rem; border: 0; border-radius: 0.5rem; background: #67482d; color: #fbf6ec; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung</h1>
      <p>Bitte prüfen Sie Ihre Internetverbindung.</p>
      <p lang="en">You are offline. Please check your internet connection.</p>
      <button onclick="location.reload()">Erneut versuchen / Retry</button>
    </main>
  </body>
</html>
