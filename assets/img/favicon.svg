<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Ears -->
  <circle cx="11" cy="13" r="4" fill="#8B5A2B" />
  <circle cx="11" cy="13" r="2" fill="#CD853F" />
  <circle cx="29" cy="13" r="4" fill="#8B5A2B" />
  <circle cx="29" cy="13" r="2" fill="#CD853F" />
  
  <!-- Head/Face Main structure -->
  <ellipse cx="20" cy="22" rx="13" ry="11" fill="#A0522D" />
  <ellipse cx="20" cy="22" rx="12" ry="10" fill="#8B5A2B" />
  
  <!-- Cheeks/Muzzle (lighter area) -->
  <circle cx="16" cy="25" r="4.5" fill="#DEB887" />
  <circle cx="24" cy="25" r="4.5" fill="#DEB887" />
  
  <!-- Teeth -->
  <rect x="18" y="27" width="2" height="3.5" fill="#FFFFFF" rx="0.3" />
  <rect x="20" y="27" width="2" height="3.5" fill="#FFFFFF" rx="0.3" />
  <line x1="20" y1="27" x2="20" y2="30.5" stroke="#A0522D" stroke-width="0.3" />
  
  <!-- Nose -->
  <ellipse cx="20" cy="22" rx="3.5" ry="2.2" fill="#333333" />
  <!-- Nose Highlight -->
  <circle cx="19" cy="21.2" r="0.6" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Eyes -->
  <circle cx="14" cy="17" r="2.2" fill="#333333" />
  <circle cx="13.5" cy="16.5" r="0.7" fill="#FFFFFF" />
  
  <circle cx="26" cy="17" r="2.2" fill="#333333" />
  <circle cx="25.5" cy="16.5" r="0.7" fill="#FFFFFF" />
</svg>