# Mercator in Docker (phase 8, DOCKER.md): the app and its PostgreSQL. Built on
# the server from this checkout; settings and secrets come from .env (see
# .env.example). A reverse proxy on the host does HTTPS and forwards to the
# published port.
# Container logs rotate by size, so they cannot grow without end; the
# privacy policy promises at most seven days (DOCKER.md "Log retention")
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    logging: *logging
    # a fixed name, so the previous version can be tagged for a rollback
    # (DOCKER.md, "Update after a code change")
    image: mercator:latest
    restart: unless-stopped
    ports:
      # host:container – only for the reverse proxy on this host, so bound to
      # localhost; change the host side if 4010 is taken
      - "127.0.0.1:${APP_PORT:-4010}:4000"
      # media of video calls (phase 10, DOCKER.md "Video calls"): UDP, from
      # everywhere, with the same numbers on host and container (the app tells
      # the browsers its port numbers); the router forwards this range here
      - "${CALL_PORT_RANGE:-50000-50049}:${CALL_PORT_RANGE:-50000-50049}/udp"
    networks:
      mercator:
        # a fixed address, so the firewall can open the call ports for this
        # container only (DOCKER.md "Video calls")
        ipv4_address: ${APP_IP:-172.30.0.10}
    environment:
      DATABASE_URL: ecto://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, see .env.example}@db/mercator
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is not set, see .env.example}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:?TOKEN_SIGNING_SECRET is not set, see .env.example}
      PHX_HOST: ${PHX_HOST:?PHX_HOST is not set, see .env.example}
      # the reverse proxy reaches the container through Docker's network
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is not set, see .env.example}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Mercator}
      SMTP_RELAY: ${SMTP_RELAY:?SMTP_RELAY is not set, see .env.example}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_VERIFY: ${SMTP_TLS_VERIFY:-true}
      BRAND: ${BRAND:-}
      MERCATOR_MODE: ${MERCATOR_MODE:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      # phone notifications (Web Push): `mix mercator.gen.vapid`
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      CALL_PORT_RANGE: ${CALL_PORT_RANGE:-50000-50049}
      # the public host name or IP the browsers reach for call media (usually
      # the same as PHX_HOST); without it calls work only inside the LAN
      CALL_PUBLIC_HOST: ${CALL_PUBLIC_HOST:-}
      CALL_ICE_SERVERS: ${CALL_ICE_SERVERS:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    logging: *logging
    restart: unless-stopped
    networks:
      - mercator
    environment:
      POSTGRES_DB: mercator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, see .env.example}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mercator"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  mercator:
    ipam:
      config:
        # change it (and APP_IP) if it collides with another network on the host
        - subnet: ${MERCATOR_SUBNET:-172.30.0.0/24}

volumes:
  db_data:
  uploads:
